<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="24" y="38" font-size="26" font-weight="700" fill="#111">2.6 Three states and the P–V path 三状态与 P-V 路径</text>

  <text x="40" y="86" font-size="22" font-weight="700" fill="#111">State 1 状态 1</text>
  <rect x="60" y="110" width="150" height="170" fill="none" stroke="#111" stroke-width="3"/>
  <rect x="60" y="150" width="150" height="22" fill="#888"/>
  <rect x="70" y="172" width="130" height="108" fill="#cfe0f7"/>
  <path d="M60 150 h150" stroke="#a33" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="86" y="126" font-size="18" fill="#a33">on supports 压在支撑环</text>
  <text x="78" y="232" font-size="18" fill="#1f4e9c">0.05 m³</text>
  <text x="78" y="256" font-size="18" fill="#1f4e9c">1 bar, 300 K</text>

  <text x="270" y="86" font-size="22" font-weight="700" fill="#111">State 2 状态 2</text>
  <rect x="290" y="110" width="150" height="170" fill="none" stroke="#111" stroke-width="3"/>
  <rect x="290" y="150" width="150" height="22" fill="#888"/>
  <rect x="300" y="172" width="130" height="108" fill="#cfe0f7"/>
  <text x="292" y="126" font-size="18" fill="#a33">just lifting 刚要抬起</text>
  <text x="308" y="232" font-size="18" fill="#1f4e9c">0.05 m³</text>
  <text x="308" y="256" font-size="18" fill="#1f4e9c">1.20 bar, 360 K</text>
  <path d="M470 196 h26" stroke="#2f8f4e" stroke-width="3"/>
  <path d="M490 188 l14 8 -14 8 z" fill="#2f8f4e"/>
  <text x="466" y="182" font-size="17" fill="#2f8f4e">+Q</text>

  <text x="520" y="86" font-size="22" font-weight="700" fill="#111">State 3 状态 3</text>
  <rect x="540" y="90" width="150" height="190" fill="none" stroke="#111" stroke-width="3"/>
  <rect x="540" y="130" width="150" height="22" fill="#888"/>
  <rect x="550" y="152" width="130" height="128" fill="#cfe0f7"/>
  <text x="542" y="106" font-size="17" fill="#a33">risen 200 mm 上升 200 mm</text>
  <text x="558" y="216" font-size="18" fill="#1f4e9c">0.070 m³</text>
  <text x="558" y="240" font-size="18" fill="#1f4e9c">1.20 bar, 504 K</text>

  <line x1="60" y1="470" x2="470" y2="470" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="470" x2="60" y2="330" stroke="#111" stroke-width="2"/>
  <text x="446" y="498" font-size="20" fill="#111">V</text>
  <text x="34" y="336" font-size="20" fill="#111">P</text>
  <line x1="170" y1="420" x2="170" y2="368" stroke="#1f4e9c" stroke-width="4"/>
  <line x1="170" y1="368" x2="330" y2="368" stroke="#1f4e9c" stroke-width="4"/>
  <circle cx="170" cy="420" r="6" fill="#111"/><text x="176" y="440" font-size="20" fill="#111">1</text>
  <circle cx="170" cy="368" r="6" fill="#111"/><text x="140" y="362" font-size="20" fill="#111">2</text>
  <circle cx="330" cy="368" r="6" fill="#111"/><text x="336" y="390" font-size="20" fill="#111">3</text>
  <text x="120" y="452" font-size="18" fill="#666">1→2: V const 定容</text>
  <text x="220" y="348" font-size="18" fill="#666">2→3: P const 恒压</text>

  <rect x="540" y="330" width="332" height="150" rx="8" fill="#fbf6e7" stroke="#c99b1e"/>
  <text x="556" y="358" font-size="20" fill="#111">P₂A = p_atm A + m_p g → 1.20 bar</text>
  <text x="556" y="386" font-size="20" fill="#111">Q₁₂ = mC_vΔT = 2.50 kJ (W₁₂ = 0)</text>
  <text x="556" y="414" font-size="20" fill="#111">W₂₃ = P₂ΔV = 2.40 kJ</text>
  <text x="556" y="442" font-size="20" fill="#111">Q₂₃ = ΔU + W = 6.00 + 2.40 = 8.40 kJ</text>
  <text x="556" y="468" font-size="18" fill="#7a5b00">total heat in 总吸热 = 10.9 kJ</text>
</svg>